[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-ai-os"
version = "0.1.0"
description = "Production-grade modular Telegram AI operating system"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "httpx==0.28.1",
  "openai==3.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["F", "I", "B", "ASYNC"]
ignore = ["B008"]
